<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>App Settings</title>
    <style>
        body {
            background-color: #212121;
            color: #fff;
            font-family: Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            width: 80%;
            max-width: 800px;
            max-height: 100vh;
            box-sizing: border-box;
            padding: 24px 0;
            overflow-y: auto;          /* the page is taller than the screen once toggle rows are added */
            scrollbar-width: none;     /* hidden: navigation is by keyboard, the selected row is scrolled into view */
        }
        .container::-webkit-scrollbar { display: none; }
        h1 {
            font-size: 36px;
            margin-top: 0;
            margin-bottom: 28px;
            text-align: center;
            color: #eee;
        }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 30px;
            margin-bottom: 10px;
            background: #333;
            border-radius: 8px;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .setting-row.selected {
            background: #444;
            border-color: #aaa;
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .label {
            font-size: 24px;
            font-weight: 500;
        }
        .label-wrap {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-right: 20px;
        }
        .hint {
            font-size: 15px;
            font-weight: 400;
            color: #999;
        }
        .value {
            font-size: 24px;
            color: #ccc;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .arrow {
            font-size: 18px;
            color: #888;
        }
        .setting-row.selected .arrow {
            color: #fff; /* Highlight arrows when row selected */
        }
        .buttons-row {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 30px;
        }
        .action-btn {
            padding: 15px 50px;
            font-size: 22px;
            border: none;
            border-radius: 30px;
            background: #333;
            color: #aaa;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .action-btn.selected {
            background: #f1f1f1;
            color: #0d0d0d;
            transform: scale(1.05);
        }
        .about-section {
            margin-top: 40px;
            text-align: center;
            color: #888;
        }
        .about-title {
            font-size: 24px;
            color: #fff;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .about-desc {
            font-size: 16px;
            line-height: 1.5;
        }
        .qr-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 25px;
        }
        .qr-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .qr-img {
            width: 120px;
            height: 120px;
            background: #fff;
            padding: 10px;
            border-radius: 8px;
        }
        .qr-label {
            font-size: 14px;
            color: #aaa;
        }
        .version-footer {
            margin-top: 25px;
            text-align: center;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>App Settings</h1>
        
        <div id="row-res" class="setting-row selected">
            <div class="label-wrap">
                <span class="label">Resolution</span>
                <span id="hint-res" class="hint"></span>
            </div>
            <div class="value">
                <span class="arrow">◄</span>
                <span id="val-res">1920x1080</span>
                <span class="arrow">►</span>
            </div>
        </div>

        <div id="row-fs" class="setting-row">
            <span class="label">Fullscreen</span>
            <div class="value">
                <span class="arrow">◄</span>
                <span id="val-fs">ON</span>
                <span class="arrow">►</span>
            </div>
        </div>

        <div id="row-url" class="setting-row">
            <span class="label">Display URL</span>
            <div class="value">
                <span class="arrow">◄</span>
                <span id="val-url">OFF</span>
                <span class="arrow">►</span>
            </div>
        </div>

        <div id="row-reset" class="setting-row">
            <span class="label" style="color: #ff6b6b;">RESET APP</span>
            <div class="value">
                <span class="arrow">CONFIRM?</span>
            </div>
        </div>

        <div class="buttons-row">
            <button id="btn-save" class="action-btn">Save & Exit</button>
            <button id="btn-cancel" class="action-btn">Cancel</button>
        </div>

        <div class="about-section">
            <div class="about-title">HTPC-YT</div>
            <div class="about-desc">
                Leanback YouTube application for HTPC use.<br>
                Created by Liam's Electronics Lab
            </div>
            <div class="qr-container">
                <div class="qr-item">
                    <!-- Blue QR for Github (color=2196F3) -->
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://github.com/Liams-Electronics-Lab&color=2196F3" class="qr-img" alt="Github QR">
                    <span class="qr-label">Github</span>
                </div>
                <div class="qr-item">
                    <!-- Red QR for Youtube (color=FF0000) -->
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://www.youtube.com/@Slot1Gamer&color=FF0000" class="qr-img" alt="Youtube QR">
                    <span class="qr-label">Youtube</span>
                </div>
            </div>
            <div class="version-footer" id="version-footer"></div>
        </div>
    </div>

    <script>
        const resolutions = [
            { w: 3840, h: 2160, label: '3840x2160 (4K)' },
            { w: 2560, h: 1440, label: '2560x1440 (2K)' },
            { w: 1920, h: 1080, label: '1920x1080' },
            { w: 1280, h: 720, label: '1280x720' },
            { w: 1024, h: 768, label: '1024x768' }
        ];
        // The selected resolution also caps video quality (the preload drops every format taller than
        // the height). The hint shows the standard YouTube tier that ends up as the ceiling, e.g. 1024x768 -> 720p.
        const QUALITY_TIERS = [144, 240, 360, 480, 720, 1080, 1440, 2160, 4320];
        function qualityCeiling(height) {
            let best = QUALITY_TIERS[0];
            for (const tier of QUALITY_TIERS) if (tier <= height) best = tier;
            return best;
        }
        let currentResIndex = 2; // Default to 1080p
        let isFullscreen = true;
        let showUrl = false;

        // On/off feature rows, built below and placed above the Reset row.
        // To add one: add an entry here AND add the key to defaultSettings + TOGGLE_KEYS in index.js.
        // `value` is only the initial placeholder; the real value arrives with 'return-settings'.
        const featureToggles = [
            { key: 'hardwareDecoding', label: 'Hardware Decoding', hint: 'Use the GPU to decode video. Restarts the app when changed.', value: true },
            { key: 'lowMemoryMode', label: 'Low Memory Mode', hint: 'Ask YouTube for its reduced-memory mode (fewer visual effects).', value: false },
            { key: 'removeSuperResolution', label: 'Remove Super Resolution', hint: 'Hide the AI-upscaled quality tier from the quality menu.', value: false },
            { key: 'adBlock', label: 'Ad Block', hint: 'Strip ads from playback, the home feed and search.', value: true },
            { key: 'highContrastText', label: 'High Contrast Text Mode', hint: "ON keeps YouTube's black boxes behind on-video text. OFF removes them and uses an outline instead.", value: true }
        ];

        // UI Element References
        const container = document.querySelector('.container');
        const rowRes = document.getElementById('row-res');
        const rowFs = document.getElementById('row-fs');
        const rowUrl = document.getElementById('row-url');
        const rowReset = document.getElementById('row-reset');
        const btnSave = document.getElementById('btn-save');
        const btnCancel = document.getElementById('btn-cancel');
        const valRes = document.getElementById('val-res');
        const hintRes = document.getElementById('hint-res');
        const valFs = document.getElementById('val-fs');
        const valUrl = document.getElementById('val-url');

        function makeSpan(className, text) {
            const s = document.createElement('span');
            if (className) s.className = className;
            if (text !== undefined) s.textContent = text;
            return s;
        }

        // Build a toggle row that looks like the hardcoded ones (label + hint on the left, ◄ VALUE ► on the right)
        function buildToggleRow(toggle) {
            const row = document.createElement('div');
            row.className = 'setting-row';
            row.id = 'row-' + toggle.key;

            const wrap = document.createElement('div');
            wrap.className = 'label-wrap';
            wrap.append(makeSpan('label', toggle.label), makeSpan('hint', toggle.hint));

            const value = document.createElement('div');
            value.className = 'value';
            toggle.valEl = makeSpan('', '');
            toggle.valEl.id = 'val-' + toggle.key;
            value.append(makeSpan('arrow', '\u25C4'), toggle.valEl, makeSpan('arrow', '\u25BA'));

            row.append(wrap, value);
            rowReset.parentNode.insertBefore(row, rowReset);
            toggle.row = row;
            return row;
        }
        featureToggles.forEach(buildToggleRow);

        // Navigable items order (indexes below are looked up, never hardcoded)
        const navItems = [rowRes, rowFs, rowUrl, ...featureToggles.map(t => t.row), rowReset, btnSave, btnCancel];
        const idxReset = navItems.indexOf(rowReset);
        const idxSave = navItems.indexOf(btnSave);
        const idxCancel = navItems.indexOf(btnCancel);
        let selectedIndex = 0;

        function toggleAt(index) {
            return featureToggles.find(t => t.row === navItems[index]);
        }

        function updateUI() {
            // Update selected row styling
            navItems.forEach((item, index) => {
                if (index === selectedIndex) item.classList.add('selected');
                else item.classList.remove('selected');
            });

            // Update values
            valRes.textContent = resolutions[currentResIndex].label;
            hintRes.textContent = 'Highest video quality: ' + qualityCeiling(resolutions[currentResIndex].h) +
                'p. Also the window size when Fullscreen is OFF.';
            valFs.textContent = isFullscreen ? 'ON' : 'OFF';
            valUrl.textContent = showUrl ? 'ON' : 'OFF';
            featureToggles.forEach(t => { t.valEl.textContent = t.value ? 'ON' : 'OFF'; });

            // Keep the selected item on screen (the mouse wheel and scrollbar are not used)
            const selected = navItems[selectedIndex];
            if (selected.classList.contains('action-btn')) {
                container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
            } else if (selectedIndex === 0) {
                container.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                selected.scrollIntoView({ block: 'center', behavior: 'smooth' });
            }
        }

        window.addEventListener('keydown', (e) => {
            e.preventDefault();
            const current = navItems[selectedIndex];
            const currentToggle = toggleAt(selectedIndex);

            switch(e.key) {
                case 'ArrowUp':
                    if (selectedIndex > 0) {
                        // Bottom buttons go back up to the Reset row
                        if (current === btnCancel || current === btnSave) {
                            selectedIndex = idxReset;
                        } else {
                            selectedIndex--;
                        }
                    }
                    break;

                case 'ArrowDown':
                    if (selectedIndex < navItems.length - 1) {
                        // Reset row goes down to the Save button
                        if (current === rowReset) {
                            selectedIndex = idxSave;
                        } else if (current.classList.contains('action-btn')) {
                            // Already at buttons, do nothing
                        } else {
                            selectedIndex++;
                        }
                    }
                    break;

                case 'ArrowLeft':
                    if (current === rowRes) {
                        if (currentResIndex < resolutions.length - 1) currentResIndex++;
                    }
                    else if (current === rowFs) {
                        isFullscreen = !isFullscreen;
                    }
                    else if (current === rowUrl) {
                        showUrl = !showUrl;
                    }
                    else if (currentToggle) {
                        currentToggle.value = !currentToggle.value;
                    }
                    else if (current === btnCancel) {
                        selectedIndex = idxSave; // Go to Save
                    }
                    break;

                case 'ArrowRight':
                    if (current === rowRes) {
                        if (currentResIndex > 0) currentResIndex--;
                    }
                    else if (current === rowFs) {
                        isFullscreen = !isFullscreen;
                    }
                    else if (current === rowUrl) {
                        showUrl = !showUrl;
                    }
                    else if (currentToggle) {
                        currentToggle.value = !currentToggle.value;
                    }
                    else if (current === btnSave) {
                        selectedIndex = idxCancel; // Go to Cancel
                    }
                    break;

                case 'Enter':
                case ' ':
                    if (current === btnSave) {
                        window.electronAPI.send('apply-settings', {
                            resolution: resolutions[currentResIndex],
                            fullscreen: isFullscreen,
                            showUrl: showUrl,
                            toggles: Object.fromEntries(featureToggles.map(t => [t.key, t.value]))
                        });
                    } else if (current === btnCancel) {
                        window.electronAPI.send('close-settings');
                    } else if (current === rowReset) {
                        if (confirm("Are you sure you want to completely reset the app? This will clear all data and settings.")) {
                             window.electronAPI.send('reset-app');
                        }
                    } else if (currentToggle) {
                        currentToggle.value = !currentToggle.value;
                    }
                    break;
                
                case 'Escape':
                case 'BrowserBack':
                    window.electronAPI.send('close-settings');
                    break;
            }
            updateUI();
        });

        // Initial Render
        // Request actual settings from main process
        window.electronAPI.on('return-settings', (settings) => {
            if (settings.appVersion) {
                document.getElementById('version-footer').textContent = 'Ver. ' + settings.appVersion;
            }
            isFullscreen = settings.fullscreen;
            showUrl = settings.showUrl || false;
            featureToggles.forEach(t => {
                if (typeof settings[t.key] === 'boolean') t.value = settings[t.key];
            });
            
            // Find resolution index match
            const foundIndex = resolutions.findIndex(r => r.w === settings.width && r.h === settings.height);
            if (foundIndex !== -1) {
                currentResIndex = foundIndex;
            } else {
                currentResIndex = 2; 
            }
            updateUI();
        });

        window.electronAPI.send('get-settings');
    </script>
</body>
</html>
